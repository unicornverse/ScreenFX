<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ScreenFX</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1 class="t-title">ScreenFX</h1>
    <button class="icon-btn" id="openOptions" type="button" aria-label="Settings">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M2.6 6.2h3.1M9.3 6.2h8.1M2.6 13.8h8.1M14.6 13.8h2.8"/>
        <circle cx="7.5" cy="6.2" r="2.1"/>
        <circle cx="12.8" cy="13.8" r="2.1"/>
      </svg>
    </button>
  </header>

  <main class="grid" id="grid" role="group" aria-label="Effects"></main>

  <section class="group">
    <div class="row">
      <span class="t-label row-text" id="durLabel">Time on screen</span>
      <div class="seg" id="dur" role="radiogroup" aria-labelledby="durLabel">
        <span class="seg-thumb" aria-hidden="true"></span>
      </div>
    </div>

    <button class="row" id="schedulesRow" type="button">
      <span class="row-text">
        <span class="t-label">Schedules</span>
        <span class="t-body" id="nextRun">No schedules yet</span>
      </span>
      <svg class="chevron" viewBox="0 0 12 12" width="11" height="11" fill="none"
           stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M4.3 2.2 8.1 6l-3.8 3.8"/>
      </svg>
    </button>
  </section>

  <p class="t-footnote hint" id="hint">Press 1–6 to play an effect.</p>

  <p class="sr-only" id="live" role="status" aria-live="polite"></p>

  <script src="popup.js"></script>
</body>
</html>
